<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHaven - Secret Confession & Support Wall</title>
    <!-- Supabase CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body { 
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            color: #f8fafc; 
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 600px;
        }
        .hero h1 {
            font-size: 34px;
            font-weight: 700;
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .hero p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* Main Form Container */
        .container { 
            width: 100%;
            max-width: 600px; 
            background: rgba(30, 41, 59, 0.5); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            margin-bottom: 35px;
        }
        .container h3 {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 16px;
        }
        .input-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(15, 23, 42, 0.6); 
            color: #fff; 
            font-size: 13px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
            background: rgba(15, 23, 42, 0.9);
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        button.post-btn { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px;
            border-radius: 10px; 
            border: none; 
            background: linear-gradient(135deg, #0ea5e9, #6366f1); 
            color: white; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.5);
            transition: all 0.3s ease;
        }
        button.post-btn:hover { 
            opacity: 0.95;
            transform: translateY(-1px);
        }
        
        /* Wall Section */
        .wall-section {
            width: 100%;
            max-width: 600px;
        }
        .wall-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: center;
            color: #38bdf8;
        }
        .feedback-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Aesthetic Cards */
        .feedback-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 15px 30px -5px rgba(0,0,0,0.4);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .card-name {
            font-weight: 600;
            font-size: 13px;
            color: #f1f5f9;
        }
        .card-category {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            font-weight: 500;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .card-message {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            word-break: break-word;
            margin-bottom: 14px;
            white-space: pre-wrap;
        }
        
        /* Replies Box */
        .replies-container {
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
        }
        .reply-item {
            background: rgba(15, 23, 42, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 6px;
            border-left: 3px solid #38bdf8;
            line-height: 1.4;
        }
        .reply-input-box {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .reply-input-box input {
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 8px;
        }
        .reply-input-box button {
            width: 80px;
            margin-top: 0;
            padding: 8px;
            font-size: 12px;
            border-radius: 8px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
        }
        .no-data {
            text-align: center;
            color: #64748b;
            padding: 25px;
            font-size: 13px;
        }

        /* Mobile responsiveness adjustments */
        @media (max-width: 480px) {
            .hero h1 { font-size: 28px; }
            .container { padding: 18px; }
            .feedback-card { padding: 15px; }
            .reply-input-box { flex-direction: column; }
            .reply-input-box button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>SafeHaven 🤍</h1>
        <p>A safe space to share your deepest thoughts anonymously, read other confessions, and offer supportive advice to anyone who needs it.</p>
    </div>

    <div class="container">
        <h3>✨ Share Your Confession</h3>
        
        <div class="input-group">
            <label>Your Name / Anonymous</label>
            <input type="text" id="fbName" placeholder="Optional (e.g., Anonymous)">
        </div>

        <div class="input-group">
            <label>Category</label>
            <select id="fbCategory">
                <option value="Secret Confession">Secret Confession</option>
                <option value="Need Support / Low Phase">Need Support / Low Phase</option>
                <option value="Seeking Advice">Seeking Advice</option>
                <option value="Random Deep Thought">Random Deep Thought</option>
            </select>
        </div>

        <div class="input-group">
            <label>Your Message</label>
            <textarea id="fbMessage" placeholder="Write your thoughts here..."></textarea>
        </div>

        <button class="post-btn" onclick="submitFeedback()">Post Anonymously ✨</button>
    </div>

    <div class="wall-section">
        <div class="wall-title">💬 Community Confessions & Replies Wall</div>
        <div class="feedback-grid" id="feedbackList">
            <div class="no-data">Loading stories of hope...</div>
        </div>
    </div>

    <script>
        // Supabase Connection Setup
        const SUPABASE_URL = 'https://bvsckrlhzrnostxnwqtk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zv5V09lgYPHB0Kmfr7Gz1Q_MeyEKEmd';

        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch Confessions and Replies
        async function loadFeedbacks() {
            try {
                const { data: posts, error } = await dbClient
                    .from('feedbacks')
                    .select('*')
                    .order('created_at', { ascending: false });

                const { data: replies } = await dbClient
                    .from('replies')
                    .select('*');

                const grid = document.getElementById("feedbackList");

                if (error) {
                    console.error('Fetch Error:', error);
                    grid.innerHTML = '<div class="no-data">Failed to load wall.</div>';
                    return;
                }

                if (!posts || posts.length === 0) {
                    grid.innerHTML = '<div class="no-data">No confessions yet. Be the first to share! 🤍</div>';
                    return;
                }

                grid.innerHTML = "";
                posts.forEach(item => {
                    let postReplies = replies ? replies.filter(r => r.post_id == item.id) : [];

                    let repliesHtml = "";
                    postReplies.forEach(rep => {
                        repliesHtml += `<div class="reply-item">💬 <b>${rep.reply_name || 'Kind Stranger'}:</b> ${rep.reply_text}</div>`;
                    });

                    let card = document.createElement("div");
                    card.className = "feedback-card";
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-name">👤 ${item.name || 'Anonymous'}</span>
                            <span class="card-category">${item.category || 'General'}</span>
                        </div>
                        <div class="card-message">${item.message}</div>
                        
                        <div class="replies-container">
                            <div style="font-size: 11px; color: #38bdf8; margin-bottom: 6px; font-weight: 600;">Read Other Replies (${postReplies.length})</div>
                            <div id="replies-list-${item.id}">
                                ${repliesHtml || '<div style="font-size:11px; color:#64748b; font-style:italic;">No replies yet. Be the first one to offer support!</div>'}
                            </div>
                            
                            <div class="reply-input-box">
                                <input type="text" id="reply-text-${item.id}" placeholder="Write a supportive suggestion...">
                                <button onclick="submitReply(${item.id})">Reply</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Catch Error:', err);
            }
        }

        // Submit New Confession
        async function submitFeedback() {
            let name = document.getElementById("fbName").value.trim();
            let category = document.getElementById("fbCategory").value;
            let message = document.getElementById("fbMessage").value.trim();

            if(message === "") {
                alert("Please write a message before posting!");
                return;
            }

            const { data, error } = await dbClient
                .from('feedbacks')
                .insert([
                    { name: name || 'Anonymous', category: category, message: message }
                ]);

            if (error) {
                console.error('Insert Error:', error);
                alert('Failed to post confession.');
            } else {
                alert('Posted securely to SafeHaven! 🤍');
                document.getElementById("fbName").value = "";
                document.getElementById("fbMessage").value = "";
                loadFeedbacks();
            }
        }

        // Submit Reply / Suggestion
        async function submitReply(postId) {
            let inputField = document.getElementById(`reply-text-${postId}`);
            let replyText = inputField.value.trim();

            if(replyText === "") {
                alert("Please write a reply first!");
                return;
            }

            const { error } = await dbClient
                .from('replies')
                .insert([
                    { post_id: postId, reply_name: 'Kind Stranger', reply_text: replyText }
                ]);

            if (error) {
                console.error('Reply Error:', error);
                alert('Failed to send reply.');
            } else {
                inputField.value = "";
                loadFeedbacks();
            }
        }

        window.onload = loadFeedbacks;
    </script>
</body>
</html>
